name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and who is affected, before describing a solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - hub/server
        - hub/web
        - hub/simulator
        - firmware
        - ml
        - documentation
        - several
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Does this affect any of these?
      options:
        - label: Privacy (audio, stored data, retention)
        - label: Security (authentication, network, permissions)
        - label: Hardware (pins, wiring, power)
        - label: The device protocol (MQTT topics or payloads)
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself
