name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can only read the repository.
permissions:
  contents: read

# Cancel older runs of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hub/server/package-lock.json
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Type-check
        run: npm run typecheck --if-present
      - name: Unit and integration tests
        run: npm test --if-present
        env:
          NODE_ENV: test
          # Throw-away values so the config validator passes in CI. Not real secrets.
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
          ADMIN_PASSWORD: ci-only-admin-password-123
          MQTT_PASSWORD: ci-only-mqtt-password-123
          DB_PATH: ":memory:"
      - name: Build
        run: npm run build --if-present

  # ---------------------------------------------------------------------------
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hub/web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - name: Production build (also catches TypeScript errors)
        run: npm run build

  # ---------------------------------------------------------------------------
  simulator:
    name: simulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hub/simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: hub/simulator/package-lock.json
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run build --if-present
      - run: npm test --if-present

  # ---------------------------------------------------------------------------
  firmware:
    name: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware (skipped if there is no firmware project)
        if: ${{ hashFiles('firmware/CMakeLists.txt') != '' }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: firmware
          # sdkconfig.defaults must contain placeholders only, so this builds without secrets.

  # ---------------------------------------------------------------------------
  ml:
    name: ml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('ml/requirements.txt') != '' }}
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Syntax check Python scripts
        if: ${{ hashFiles('ml/*.py') != '' }}
        run: python -m compileall -q ml

  # ---------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check that required repository files exist
        run: |
          missing=0
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md hub/.env.example; do
            if [ ! -f "$f" ]; then echo "::error::Missing $f"; missing=1; fi
          done
          exit $missing
      - name: Make sure no real environment files or databases are tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)sdkconfig$|\.db$|\.sqlite3?$|\.pem$|\.key$|\.pcap(ng)?$' || true)
          if [ -n "$bad" ]; then echo "::error::Sensitive files are tracked:"; echo "$bad"; exit 1; fi
      - name: Check for leftover placeholders in public docs
        run: |
          if grep -rnE "\[YOUR (FULL NAME|SECURITY EMAIL|CONTACT EMAIL)\]" README.md LICENSE SECURITY.md CODE_OF_CONDUCT.md; then
            echo "::warning::Fill in the [YOUR ...] placeholders before publishing"
          fi
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --exclude '^https://github.com/amitabhchondar-ux/ASVA/(actions|security)' './**/*.md'
          fail: false

  # ---------------------------------------------------------------------------
  # End-to-end tests against the simulator. DISABLED until Playwright tests exist.
  # To enable: remove "if: false" and make sure hub/web has playwright tests.
  e2e:
    name: e2e
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run setup
      - run: npm run bootstrap
      - name: Start hub and simulator in the background
        run: |
          npm start &
          sleep 5
          npm run simulate &
          npx --yes wait-on http://localhost:8080/api/health --timeout 60000
      - run: npx playwright install --with-deps chromium
        working-directory: hub/web
      - run: npx playwright test
        working-directory: hub/web
